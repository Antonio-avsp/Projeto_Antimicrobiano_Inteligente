[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antimicrobiano-inteligente"
dynamic = ["version"]
description = "API de apoio ao gerenciamento do uso de antimicrobianos (stewardship) com motor de regras explicável."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Antonio-avsp" }]
keywords = ["stewardship", "antimicrobianos", "fastapi", "saude"]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "pyjwt>=2.8,<3",
]

[project.urls]
Repositorio = "https://github.com/Antonio-avsp/Projeto_Antimicrobiano_Inteligente"
Documentacao = "https://github.com/Antonio-avsp/Projeto_Antimicrobiano_Inteligente/tree/main/docs"
Issues = "https://github.com/Antonio-avsp/Projeto_Antimicrobiano_Inteligente/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "httpx2>=2.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "antimicrobiano.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antimicrobiano = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["antimicrobiano"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
