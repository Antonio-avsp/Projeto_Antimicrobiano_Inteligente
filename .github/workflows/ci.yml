name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (ruff e bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Formatação (ruff format --check)
        run: ruff format --check .

      - name: Análise de segurança do código (bandit)
        run: bandit -c pyproject.toml -r src

  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Executar testes com cobertura mínima de 80%
        run: pytest --cov --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Publicar o relatório de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-cobertura
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Construir a imagem
        run: docker build -t antimicrobiano-inteligente:ci .

      - name: Verificar se a API sobe no contêiner
        run: |
          docker run -d --name ami -p 8000:8000 antimicrobiano-inteligente:ci
          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs ami
          exit 1
