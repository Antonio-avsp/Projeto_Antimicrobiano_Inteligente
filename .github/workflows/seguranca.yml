name: Segurança

# Varredura de segredos versionados e auditoria de vulnerabilidades conhecidas nas dependências.
# Roda em todo push e pull request e uma vez por semana (vulnerabilidades novas surgem
# mesmo sem mudanças no código).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Obter o código com todo o histórico
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Procurar segredos nos commits
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependencias:
    name: Dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar a aplicação e o pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit

      - name: Auditar as dependências instaladas
        run: pip-audit --skip-editable --desc
